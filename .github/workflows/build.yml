name: Build amd64

# Publishes downloadable linux/amd64 and darwin/amd64 binaries from the
# default branch and on demand. This is not a release: release.yml owns tags,
# packaging, checksums, signing, and the GitHub Release.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight build of the same ref.
concurrency:
  group: build-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe --tags supplies the version baked into the binary.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build linux/amd64 and darwin/amd64
        run: make build-amd64
      # The darwin binary cannot run here; the linux one can, so prove it
      # starts and reports the version before uploading.
      - name: Smoke test linux/amd64
        run: bin/san_linux_amd64 version
      - name: Upload linux/amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: san-linux-amd64
          path: bin/san_linux_amd64
      - name: Upload darwin/amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: san-darwin-amd64
          path: bin/san_darwin_amd64
